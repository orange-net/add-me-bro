[package]
name = "add-me-bro"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.8", features = ["macros", "json"]}
color-eyre = "0.6.5"
config = "0.15.19"
derive_builder = "0.20.2"
eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.0.228", features = ["full"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
sea-orm = { version = "2.0.0-rc.22", features = [ "sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
parse-display-derive = "0.10.0"
validator = { version = "0.20.0", features = ["derive"] }
